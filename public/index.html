<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Gem's 自适应背单词 MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; }
    .card { transition: transform 0.3s ease; }
    .card:active { transform: scale(0.98); }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="h-screen flex items-center justify-center">

  <div id="app" class="w-full max-w-md p-6 bg-white rounded-2xl shadow-xl flex flex-col items-center min-h-[400px]">
    
    <!-- 头部信息 -->
    <div class="w-full flex justify-between items-center mb-8">
      <h1 class="text-xl font-bold text-gray-800">🧠 极客背单词</h1>
      <span id="progressText" class="text-sm font-medium text-blue-500">...</span>
    </div>

    
    <!-- 数据大屏 -->
    <div id="statsPanel" class="w-full grid grid-cols-4 gap-2 text-center bg-gray-50 rounded-xl p-4 mb-6 border border-gray-100 shadow-sm text-xs">
      <div><span class="block text-gray-400 mb-1">今日复习</span><strong id="st-today" class="text-blue-600 text-xl">0</strong></div>
      <div><span class="block text-gray-400 mb-1">新词剩余</span><strong id="st-new" class="text-gray-700 text-xl">0</strong></div>
      <div><span class="block text-gray-400 mb-1">正在死磕</span><strong id="st-learning" class="text-orange-500 text-xl">0</strong></div>
      <div><span class="block text-gray-400 mb-1">牢固掌握</span><strong id="st-mastered" class="text-green-600 text-xl">0</strong></div>
    </div>

    <!-- 单词显示区 -->
    <div id="wordContainer" class="flex-1 w-full flex flex-col items-center justify-center text-center">
      <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-colors">
        获取今日任务
      </button>

      <div id="messageContainer" class="hidden w-full flex flex-col items-center"></div>
      <div id="flashcard" class="hidden w-full flex flex-col items-center">
        <div class="flex items-center justify-center space-x-4 mb-6">
          <h2 id="wordText" class="text-5xl font-black text-gray-900 tracking-tight">word</h2>
          <button id="speakBtn" class="text-gray-400 hover:text-blue-500 transition-colors p-2 rounded-full hover:bg-blue-50 focus:outline-none" title="播放发音">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707A.996.996 0 0014 21V3a.996.996 0 00-1.707-.707L9.586 10H7a2 2 0 00-2 2z" />
            </svg>
          </button>
        </div>
        
        <!-- 释义区（默认隐藏） -->
        <div id="meaningBox" class="w-full bg-gray-50 rounded-xl p-4 mb-8 hidden border border-gray-100">
          <p id="phoneticText" class="text-sm text-blue-500 font-mono mb-2"></p>
          <p id="meaningText" class="text-xl text-gray-700"></p>
          <div id="exampleBox" class="mt-4 pt-4 border-t border-gray-200 hidden">
              <p id="exampleText" class="text-sm text-blue-600 font-medium italic"></p>
              <p id="exampleMeaningText" class="text-xs text-gray-500 mt-1"></p>
          </div>
          <p id="statsText" class="text-xs text-gray-400 mt-2 font-mono"></p>
        </div>

        <button id="showBtn" class="w-full py-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl transition-colors text-lg">
          点击显示释义
        </button>
      </div>
    </div>

    <!-- 底部按钮区 (由JS根据状态动态渲染) -->
    <div id="actionButtons" class="w-full hidden grid grid-cols-4 gap-2 mt-auto">
    </div>

  </div>

  <script>
    // 🌟 核心魔法：调用浏览器原生语音引擎 (TTS)
    function speakWord(text) {
      if (!('speechSynthesis' in window)) {
        console.error("浏览器不支持语音合成");
        return;
      }
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'en-US';
      msg.rate = 0.85;
      window.speechSynthesis.speak(msg);
    }

    const USER_ID = "test-user-1";
    let cards = [];
    let currentIndex = 0;
    let startTime = 0;

    const startBtn = document.getElementById('startBtn');
    const flashcard = document.getElementById('flashcard');
    const messageContainer = document.getElementById('messageContainer');
    const wordText = document.getElementById('wordText');
    const meaningBox = document.getElementById('meaningBox');
    const phoneticText = document.getElementById('phoneticText');
    const meaningText = document.getElementById('meaningText');
    const exampleBox = document.getElementById('exampleBox');
    const exampleText = document.getElementById('exampleText');
    const exampleMeaningText = document.getElementById('exampleMeaningText');
    const statsText = document.getElementById('statsText');
    const showBtn = document.getElementById('showBtn');
    const actionButtons = document.getElementById('actionButtons');
    const progressText = document.getElementById('progressText');

    async function loadStats() {
      try {
        const res = await fetch(`/api/study/stats?userId=${USER_ID}`);
        const result = await res.json();
        if (result.success) {
          document.getElementById('st-today').innerText = result.data.todayReviews;
          document.getElementById('st-new').innerText = result.data.newWords;
          document.getElementById('st-learning').innerText = result.data.learning;
          document.getElementById('st-mastered').innerText = result.data.mastered;
        }
      } catch (e) { console.error('刷新统计失败', e); }
    }
    loadStats();

    async function loadTasks(isAutoLoad = false) {
      try {
        const res = await fetch(`/api/study/today?userId=${USER_ID}`);
        const result = await res.json();
        cards = result.data;
        currentIndex = 0;
        
        if (cards.length === 0) {
          // 🌟 强力清理所有交互按钮
          actionButtons.innerHTML = ''; 
          actionButtons.classList.add('hidden');
          
          if (window.autoRefreshTimer) clearTimeout(window.autoRefreshTimer);
          if (window.countdownInterval) clearInterval(window.countdownInterval);
          
          const nextDueTime = result.nextDueTime ? new Date(result.nextDueTime) : null;
          const now = new Date();
          let msgTitle = "🎉 暂无可用任务";
          let msgBody = "";

          if (nextDueTime && nextDueTime.getDate() === now.getDate() && nextDueTime.getMonth() === now.getMonth()) {
            const diffMs = nextDueTime.getTime() - now.getTime();
            const diffMins = Math.ceil(diffMs / 60000);
            
            if (diffMs <= 0) {
               msgBody = "新的记忆碎片刚刚浮现，正在拉取...";
               window.autoRefreshTimer = setTimeout(() => loadTasks(true), 1000);
            } else if (diffMins < 60) {
               msgBody = `大脑需要休息！下一批记忆将在<br>
               <span id="countdownDisplay" class="text-blue-600 font-mono text-4xl font-black mt-6 mb-4 inline-block tracking-widest bg-blue-50 py-3 px-6 rounded-2xl shadow-inner border border-blue-100">--:--</span>
               <br>后浮现。<br><span class="text-sm text-gray-400">（请勿关闭页面，倒计时结束将自动跳出单词）</span>`;
               
               let targetTime = nextDueTime.getTime() + 1000;
               window.countdownInterval = setInterval(() => {
                 let remainMs = targetTime - Date.now();
                 const cdEl = document.getElementById('countdownDisplay');
                 
                 if (remainMs <= 0) {
                   clearInterval(window.countdownInterval);
                   if (cdEl) cdEl.innerText = "00:00";
                   console.log("⏰ 倒计时结束，自动拉取新任务！");
                   messageContainer.classList.add('hidden');
                   setTimeout(() => { loadTasks(true); }, 500);
                 } else {
                   let m = Math.floor(remainMs / 60000);
                   let s = Math.floor((remainMs % 60000) / 1000);
                   let display = (m < 10 ? '0'+m : m) + ':' + (s < 10 ? '0'+s : s);
                   if (cdEl) cdEl.innerText = display;
                 }
               }, 1000);
            } else {
               const diffHours = Math.floor(diffMins / 60);
               msgBody = `下一批复习将在 <b class="text-blue-600">${diffHours} 小时 ${diffMins % 60} 分钟</b> 后开启，稍后再来挑战！`;
            }
          } else {
            msgTitle = "🎉 真正的搞定！";
            msgBody = "短时记忆循环已清空，今日所有复习已达标，明天见！";
          }

          startBtn.classList.add('hidden');
          flashcard.classList.add('hidden');
          messageContainer.classList.remove('hidden');
          
          messageContainer.innerHTML = `<h2 class="text-3xl font-bold text-green-600">${msgTitle}</h2><p class="text-gray-500 mt-4 text-lg">${msgBody}</p>`;
          progressText.innerText = "休息中";
          
          return;
        }

        startBtn.classList.add('hidden');
        messageContainer.classList.add('hidden');
        flashcard.classList.remove('hidden');
        showCard();
      } catch (e) { console.error(e); }
    }

    startBtn.addEventListener('click', () => loadTasks(false));

    function showCard() {
      if (currentIndex >= cards.length) { loadTasks(true); return; }

      const card = cards[currentIndex];
      wordText.innerText = card.word;
      speakWord(card.word);
      phoneticText.innerText = card.phonetic || "";
      meaningText.innerText = card.meaning || "(暂无释义)";
      
      if (card.exampleSentence) {
        exampleBox.classList.remove('hidden');
        exampleText.innerText = card.exampleSentence;
        exampleMeaningText.innerText = card.exampleMeaning || "";
      } else {
        exampleBox.classList.add('hidden');
      }

      statsText.innerText = `[状态: ${["新词", "学习", "复习", "重学"][card.state]}]`;
      meaningBox.classList.add('hidden');
      actionButtons.classList.add('hidden');
      showBtn.classList.remove('hidden');
      startTime = Date.now();
    }

    showBtn.addEventListener('click', () => {
      const card = cards[currentIndex];
      
      // 清空旧按钮
      actionButtons.innerHTML = '';
      
      // 创建按钮的辅助函数
      const createBtn = (text, action) => {
        const btn = document.createElement('button');
        btn.innerText = text;
        btn.className = "card py-4 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold rounded-xl text-lg col-span-2 shadow-sm";
        btn.addEventListener('click', action);
        return btn;
      };

      if (card.state === 0) {
        actionButtons.appendChild(createBtn('不认识', () => submitReview(1)));
        actionButtons.appendChild(createBtn('认识', () => submitDynamicReview()));
      } else {
        actionButtons.appendChild(createBtn('不记得', () => submitReview(1)));
        actionButtons.appendChild(createBtn('记得', () => submitDynamicReview()));
      }

      showBtn.classList.add('hidden');
      meaningBox.classList.remove('hidden');
      actionButtons.classList.remove('hidden');
    });

    async function submitReview(rating) {
      const card = cards[currentIndex];
      const durationMs = Date.now() - startTime;
      currentIndex++;
      showCard();
      await fetch('/api/study/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: USER_ID, cardId: card.id, rating, durationMs })
      });
      loadStats();
    }

    async function submitDynamicReview() {
      const durationMs = Date.now() - startTime;
      let rating = 3;
      if (durationMs < 2000) rating = 4;
      else if (durationMs > 5000) rating = 2;
      await submitReview(rating);
    }

    document.getElementById('speakBtn').addEventListener('click', () => {
      if (cards[currentIndex]) speakWord(cards[currentIndex].word);
    });
  </script>
</body>
</html>
