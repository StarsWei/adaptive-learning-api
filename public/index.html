<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Gem's 自适应背单词 MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; }
    .card { transition: transform 0.3s ease; }
    .card:active { transform: scale(0.98); }
    [x-cloak] { display: none !important; }
    
    #flashcard {
      background: white;
      padding: 1rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid #f3f4f6;
      width: 100%;
      max-width: 400px;
      height: 350px;
      flex-direction: column;
      align-items: center;
      transition: box-shadow 0.3s ease;
      overflow-y: auto;
    }
    .swipe-out-left { animation: swipeOutLeft 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .swipe-out-right { animation: swipeOutRight 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

    @keyframes swipeOutLeft {
      from { transform: translateX(0) rotate(0); opacity: 1; }
      to { transform: translateX(-150%) rotate(-30deg); opacity: 0; }
    }
    @keyframes swipeOutRight {
      from { transform: translateX(0) rotate(0); opacity: 1; }
      to { transform: translateX(150%) rotate(30deg); opacity: 0; }
    }
    
    .reveal { animation: reveal 0.2s ease-out forwards; }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    
    .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="h-screen flex items-center justify-center">

  <div id="app" class="w-full max-w-md p-6 bg-white rounded-2xl shadow-xl flex flex-col items-center h-[600px] relative overflow-visible">
    
    <div class="w-full flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-gray-800">🧠 极客背单词</h1>
      <span id="progressText" class="text-sm font-medium text-blue-500">...</span>
    </div>

    
    <div id="statsPanel" class="w-full grid grid-cols-4 gap-1 text-center bg-gray-50 rounded-xl p-3 mb-4 border border-gray-100 shadow-sm text-xs">
      <div><span class="block text-gray-400 mb-0.5">复习</span><strong id="st-today" class="text-blue-600 text-lg">0</strong></div>
      <div><span class="block text-gray-400 mb-0.5">新词</span><strong id="st-new" class="text-gray-700 text-lg">0</strong></div>
      <div><span class="block text-gray-400 mb-0.5">死磕</span><strong id="st-learning" class="text-orange-500 text-lg">0</strong></div>
      <div><span class="block text-gray-400 mb-0.5">掌握</span><strong id="st-mastered" class="text-green-600 text-lg">0</strong></div>
    </div>

    <div id="wordContainer" class="flex-1 w-full flex flex-col items-center justify-center text-center">
      <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-colors">
        获取今日任务
      </button>

      <div id="messageContainer" class="hidden w-full flex flex-col items-center"></div>
      <div id="flashcard" class="hidden w-full flex-col items-center">
        <div class="flex items-center justify-center space-x-4 mb-2">
          <h2 id="wordText" class="text-4xl font-black text-gray-900 tracking-tight">word</h2>
          <button id="speakBtn" class="text-gray-400 hover:text-blue-500 transition-colors p-2 rounded-full hover:bg-blue-50 focus:outline-none" title="播放发音">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707A.996.996 0 0014 21V3a.996.996 0 00-1.707-.707L9.586 10H7a2 2 0 00-2 2z" />
            </svg>
          </button>
        </div>
        
        <div id="meaningBox" class="w-full bg-gray-50 rounded-xl p-3 mb-3 hidden border border-gray-100">
          <p id="phoneticText" class="text-sm text-blue-500 font-mono mb-1"></p>
          <p id="meaningText" class="text-lg text-gray-700"></p>
          <div id="exampleBox" class="mt-2 pt-2 border-t border-gray-200 invisible">
              <p id="exampleText" class="text-sm text-blue-600 font-medium italic"></p>
              <p id="exampleMeaningText" class="text-xs text-gray-500 mt-0.5"></p>
          </div>
          <p id="statsText" class="text-[10px] text-gray-400 mt-1 font-mono"></p>
        </div>

        <button id="showBtn" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl transition-colors text-base">
          点击显示释义
        </button>
      </div>
    </div>

    <div id="actionButtons" class="w-full hidden grid grid-cols-2 gap-4 mt-2">
    </div>

  </div>

  <script>
    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'en-US';
      msg.rate = 0.85;
      window.speechSynthesis.speak(msg);
    }

    const USER_ID = "test-user-1";
    let cards = [];
    let currentIndex = 0;
    let startTime = 0;

    const startBtn = document.getElementById('startBtn');
    const flashcard = document.getElementById('flashcard');
    const messageContainer = document.getElementById('messageContainer');
    const wordText = document.getElementById('wordText');
    const meaningBox = document.getElementById('meaningBox');
    const phoneticText = document.getElementById('phoneticText');
    const meaningText = document.getElementById('meaningText');
    const exampleBox = document.getElementById('exampleBox');
    const exampleText = document.getElementById('exampleText');
    const exampleMeaningText = document.getElementById('exampleMeaningText');
    const statsText = document.getElementById('statsText');
    const showBtn = document.getElementById('showBtn');
    const actionButtons = document.getElementById('actionButtons');
    const progressText = document.getElementById('progressText');

    async function loadStats() {
      try {
        const res = await fetch(`/api/study/stats?userId=${USER_ID}`);
        const result = await res.json();
        if (result.success) {
          document.getElementById('st-today').innerText = result.data.todayReviews;
          document.getElementById('st-new').innerText = result.data.newWords;
          document.getElementById('st-learning').innerText = result.data.learning;
          document.getElementById('st-mastered').innerText = result.data.mastered;
        }
      } catch (e) { console.error('刷新统计失败', e); }
    }
    loadStats();

    async function loadTasks(isAutoLoad = false) {
      try {
        const res = await fetch(`/api/study/today?userId=${USER_ID}`);
        const result = await res.json();
        cards = result.data;
        currentIndex = 0;
        
        if (cards.length === 0) {
            actionButtons.innerHTML = ''; 
            actionButtons.classList.add('hidden');
            startBtn.classList.add('hidden');
            flashcard.classList.add('hidden');
            messageContainer.classList.remove('hidden');

            const nextDueTime = result.nextDueTime ? new Date(result.nextDueTime) : null;
            const now = new Date();
            let msgTitle = "🎉 暂无可用任务";
            let msgBody = "";

            if (nextDueTime) {
                // 判断是否是明天或者更晚
                const todayMidnight = new Date(now);
                todayMidnight.setHours(23, 59, 59, 999);
                
                if (nextDueTime > todayMidnight) {
                    msgBody = "今日任务已全部完成，请明日再来！";
                    messageContainer.innerHTML = `<h2 class="text-3xl font-bold text-green-600">${msgTitle}</h2><p class="text-gray-500 mt-4 text-lg">${msgBody}</p>`;
                } else if (nextDueTime > now) {
                    const diffMs = nextDueTime.getTime() - now.getTime();
                    const diffMins = Math.ceil(diffMs / 60000);
                    
                    msgBody = `大脑需要休息！下一批记忆将在<br>
                    <span id="countdownDisplay" class="text-blue-600 font-mono text-4xl font-black mt-6 mb-4 inline-block tracking-widest bg-blue-50 py-3 px-6 rounded-2xl shadow-inner border border-blue-100">--:--</span>
                    <br>后浮现。`;
                    
                    messageContainer.innerHTML = `<h2 class="text-3xl font-bold text-green-600">${msgTitle}</h2><p class="text-gray-500 mt-4 text-lg">${msgBody}</p>`;
                    
                    let targetTime = nextDueTime.getTime();
                    window.countdownInterval = setInterval(() => {
                        let remainMs = targetTime - Date.now();
                        const cdEl = document.getElementById('countdownDisplay');
                        if (remainMs <= 0) {
                            clearInterval(window.countdownInterval);
                            loadTasks(true);
                        } else {
                            let m = Math.floor(remainMs / 60000);
                            let s = Math.floor((remainMs % 60000) / 1000);
                            if (cdEl) cdEl.innerText = (m < 10 ? '0'+m : m) + ':' + (s < 10 ? '0'+s : s);
                        }
                    }, 1000);
                } else {
                    // 假如已经到了时间但任务没刷出来，强制刷新
                    loadTasks(true);
                    return;
                }
            } else {
                messageContainer.innerHTML = `<h2 class="text-3xl font-bold text-green-600">🎉 真正的搞定！</h2><p class="text-gray-500 mt-4 text-lg">今日所有复习已达标，明天见！</p>`;
            }
            progressText.innerText = "休息中";
            return;
        }

        startBtn.classList.add('hidden');
        messageContainer.classList.add('hidden');
        flashcard.classList.remove('hidden');
        // 彻底移除入场滑动动画
        flashcard.classList.remove('swipe-in', 'swipe-out-left', 'swipe-out-right');
        showCard();
      } catch (e) { console.error(e); }
    }

    startBtn.addEventListener('click', () => loadTasks(false));

    function showCard() {
      const card = cards[currentIndex];
      
      // 更新进度提示：第几张/总数
      progressText.innerText = `${currentIndex + 1} / ${cards.length}`;

      wordText.innerText = card.word;
      speakWord(card.word);
      phoneticText.innerText = card.phonetic || "";
      meaningText.innerText = card.meaning || "(暂无释义)";
      
      if (card.exampleSentence) {
        exampleBox.classList.remove('invisible');
        exampleText.innerText = card.exampleSentence;
        exampleMeaningText.innerText = card.exampleMeaning || "";
      } else {
        exampleBox.classList.add('invisible');
      }

      statsText.innerText = `[状态: ${["新词", "学习", "复习", "重学"][card.state]}]`;
      meaningBox.classList.add('hidden');
      actionButtons.classList.add('hidden');
      showBtn.classList.remove('hidden');
      startTime = Date.now();
    }

    showBtn.addEventListener('click', () => {
      const card = cards[currentIndex];
      actionButtons.innerHTML = '';
      const createBtn = (text, action, color = 'blue') => {
        const btn = document.createElement('button');
        btn.innerText = text;
        btn.className = `flex-1 py-4 bg-${color}-100 hover:bg-${color}-200 text-${color}-700 font-bold rounded-xl text-lg shadow-sm transition-all duration-300`;
        btn.addEventListener('click', action);
        return btn;
      };

      if (card.state === 0) {
        actionButtons.appendChild(createBtn('不认识', () => submitReview(1, 'left'), 'red'));
        actionButtons.appendChild(createBtn('认识', () => submitReview(3, 'right'), 'blue'));
      } else {
        actionButtons.appendChild(createBtn('不记得', () => submitReview(1, 'left'), 'red'));
        actionButtons.appendChild(createBtn('记得', () => submitReview(3, 'right'), 'blue'));
      }

      showBtn.classList.add('hidden');
      meaningBox.classList.remove('hidden');
      meaningBox.classList.add('fade-in');
      actionButtons.classList.remove('hidden');
    });

    document.addEventListener('keydown', (e) => {
      if ([' ', 'Enter'].includes(e.key) && !showBtn.classList.contains('hidden')) showBtn.click();
      if (e.key === 'ArrowLeft' && !actionButtons.classList.contains('hidden')) actionButtons.children[0].click();
      if (e.key === 'ArrowRight' && !actionButtons.classList.contains('hidden')) actionButtons.children[1].click();
    });

    async function submitReview(rating, direction) {
      const card = cards[currentIndex];
      const durationMs = Date.now() - startTime;
      
      // 触发甩出动画
      flashcard.classList.add(direction === 'left' ? 'swipe-out-left' : 'swipe-out-right');
      
      fetch('/api/study/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: USER_ID, cardId: card.id, rating, durationMs })
      }).then(() => loadStats());
      
      setTimeout(() => {
        currentIndex++;
        if (currentIndex >= cards.length) {
          loadTasks(true);
        } else {
          // 清除甩出样式，恢复静止状态
          flashcard.classList.remove('swipe-out-left', 'swipe-out-right');
          showCard();
          // 加上一个微弱的显现动画
          flashcard.classList.add('reveal');
          setTimeout(() => flashcard.classList.remove('reveal'), 200);
        }
      }, 300);
    }
  </script>
</body>
</html>
